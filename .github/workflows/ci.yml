name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          for target in \
            linux/amd64 \
            linux/arm64 \
            darwin/amd64 \
            darwin/arm64
          do
            os="${target%/*}"
            arch="${target#*/}"

            CGO_ENABLED=0 \
            GOOS="$os" \
            GOARCH="$arch" \
            go build -trimpath \
              -o "dist/greybeard_${os}_${arch}" .
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: greybeard-binaries
          path: dist/
          retention-days: 7
