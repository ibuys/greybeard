
name: Release Greybeard

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          for target in \
            linux/amd64 \
            linux/arm64 \
            darwin/amd64 \
            darwin/arm64
          do
            os="${target%/*}"
            arch="${target#*/}"
            tmp="$(mktemp -d)"

            CGO_ENABLED=0 \
            GOOS="$os" \
            GOARCH="$arch" \
            go build -trimpath -o "$tmp/greybeard" .

            archive="greybeard_${GITHUB_REF_NAME}_${os}_${arch}.tar.gz"
            tar -C "$tmp" -czf "dist/$archive" greybeard
            rm -rf "$tmp"
          done

          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --verify-tag \
            --generate-notes
